[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-analytics"
version = "0.1.0"
description = "IBM Telco customer churn portfolio — analytics, SQL and guarded Logistic Regression"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3", "numpy>=1.26,<3", "scipy>=1.10,<2",
    "matplotlib>=3.9,<4", "seaborn>=0.13.2,<0.14",
    "scikit-learn>=1.5,<2", "joblib>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
